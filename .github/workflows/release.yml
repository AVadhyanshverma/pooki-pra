name: Release Pooki-Pra Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: pooki-pra
            archive_name: pooki-pra-linux-x86_64.tar.gz

          - target: aarch64-apple-darwin
            os: macos-latest
            bin_name: pooki-pra
            archive_name: pooki-pra-macos-arm64.tar.gz

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: pooki-pra.exe
            archive_name: pooki-pra-windows-x86_64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: |
          cd crates/pooki-pra
          cargo build --release --target ${{ matrix.target }}

      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cd crates/pooki-pra/target/${{ matrix.target }}/release
          tar -czf ../../../../../${{ matrix.archive_name }} ${{ matrix.bin_name }}

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cd crates/pooki-pra/target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.bin_name }} -DestinationPath ../../../../../${{ matrix.archive_name }}

      - name: Upload artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
